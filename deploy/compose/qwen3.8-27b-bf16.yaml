# Qwen3.8-27B in bf16, the checkpoint's own weights: half each card is weights, the rest is cache.
name: radiance-qwen3.8-27b-bf16
services:
  radiance:
    extends: { file: common.yaml, service: radiance }
    container_name: radiance-qwen3.8-27b-bf16
    command: >
      --model /models/qwen3.8-27b-bf16.rad
      --host :: --port ${PORT:-8000} --api-key ${RADIANCE_API_KEY:?set RADIANCE_API_KEY in .env}
      --tp 2 --max-num-seqs 8 --max-model-len 200000 --kv-cache-dtype fp8
