# Qwen3.6-35B-A3B, FP8 as published: a 256-expert MoE that fits both cards whole.
name: radiance-qwen3.6-35b-a3b
services:
  radiance:
    extends: { file: common.yaml, service: radiance }
    container_name: radiance-qwen3.6-35b-a3b
    command: >
      --model /models/qwen3.6-35b-a3b-fp8.rad
      --host :: --port ${PORT:-8000} --api-key ${RADIANCE_API_KEY:?set RADIANCE_API_KEY in .env}
      --tp 2 --max-num-seqs 32 --max-model-len 200000 --kv-cache-dtype fp8
